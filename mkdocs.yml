site_name: Arca Documentation
site_url: https://bceln.github.io/arca-docs
repo_url: https://github.com/bceln/arca-docs
edit_uri: edit/main/docs


theme:
  name: material
  logo: 'assets/Arca_Logo_web.svg'
  palette:
    primary: 'cyan'
    accent: 'purple'
  language: 'en'
  features:
    - content.action.edit
    - content.action.view
    - announce.dismiss
  icon:
    edit: material/pencil
    view: material/eye

markdown_extensions:
  - admonition
  - footnotes
  - toc:
        permalink: True
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true  

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About:
    - About Arca: about/about-arca.md
    - Arca Participants: about/arca-participants.md
    - Contribute to Arca Docs: about/contributing.md
    - Support: about/support.md    
  - Training and Onboarding:
